[package]
name = "simulator"
version = "0.1.0"
edition = "2024"

[[bin]]
name = "simulator"
path = "src/main.rs"

[lints.rust]
unsafe_code = "forbid"
unused = { level = "allow", priority = -1 } #-- for aa kome igang


[dependencies]
macroquad = "0.3"
rand = "0.8"
#rstest = "0.25.0"

[lints.clippy]
pedantic = { level = "deny", priority = -1 }   # UM, ACTUALLY
nursery = { level = "deny", priority = -1 }    # BETA LINTS
# DENY PANICS
unwrap_used = "deny"
expect_used = "deny"
indexing_slicing = "deny"
arithmetic_side_effects = "deny"
unreachable = "deny"
unimplemented = "deny"
unchecked_time_subtraction = "deny"
todo = "deny"
string_slice = "deny"
panic_in_result_fn = "deny"
panic = "deny"
exit = "deny"
as_conversions = "deny"
